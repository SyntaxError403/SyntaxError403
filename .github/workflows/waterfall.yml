name: waterfall

on:
  schedule:
    - cron: "17 5 * * *"     # nightly, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waterfall
  cancel-in-progress: true

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Without a token the survey cannot read commit history, so stop cleanly
      # rather than failing every night until the secret is added.
      - name: Check for token
        id: gate
        env:
          GH_TOKEN: ${{ secrets.WATERFALL_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WATERFALL_TOKEN is not set - skipping sweep."
            echo "Add a fine-grained PAT (read-only Contents) as the repository"
            echo "secret WATERFALL_TOKEN to enable the nightly survey."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sweep and render
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.WATERFALL_TOKEN }}
        run: node .waterfall/cli.mjs all

      - name: Commit if the band changed
        if: steps.gate.outputs.ok == 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no change"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "waterfall: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
